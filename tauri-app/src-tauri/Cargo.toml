[package]
name = "dsh-desktop"
version = "0.1.7-rc.2"
description = "DeepSeek Harness Desktop"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
tauri-plugin-dialog = "2"
# 会话完成通知：原生系统通知（Windows toast / macOS 通知中心）。
# 固定在 2.4.x：2.5.0 要求 tauri ^2.12，会整体升级 Tauri（规格 §7 禁止）。
tauri-plugin-notification = "=2.4.0"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
ureq = "2"

[features]
custom-protocol = ["tauri/custom-protocol"]
