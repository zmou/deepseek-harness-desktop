[package]
name = "dsh-desktop"
version = "0.1.5-rc.2"
description = "DeepSeek Harness Desktop"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-single-instance = "2"
tauri-plugin-dialog = "2"
regex = "1"
url = "2"
ureq = "2"

[features]
custom-protocol = ["tauri/custom-protocol"]
